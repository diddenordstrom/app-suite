services:
  app:
    image: ghcr.io/diddenordstrom/garden:latest  # built from the app-suite monorepo
    container_name: garden
    restart: unless-stopped
    volumes: ["./data:/data"]  # SQLite at /data/app.db
    networks: [proxy]  # cloudflared reaches it at http://garden:3000, so no published port
    environment:
      AUTH_MODE: "oidc"
      PUBLIC_URL: "https://garden.didrik.dev"
      SESSION_SECRET: "a-long-random-string"  # >= 32 characters
      OIDC_ISSUER: "https://sso.didrik.dev"  # Pocket ID
      OIDC_CLIENT_ID: "from-pocket-id"
      OIDC_CLIENT_SECRET: "from-pocket-id"
networks:
  proxy:
    external: true
# Pocket ID client: callback URL https://garden.didrik.dev/api/auth/callback
# (not group-restricted, or include the group of everyone who should get in).
# Every Pocket ID account gets its own household on first login; share a
# household with Settings → Members → invite link.
# Cloudflare Tunnel: public hostname garden.didrik.dev -> http://garden:3000
# Start with an empty ./data: households from the pre-login app have no owner
# and would not be visible to anyone.
