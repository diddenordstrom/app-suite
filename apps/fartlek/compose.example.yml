services:
  app:
    image: ghcr.io/diddenordstrom/fartlek:latest  # built from the app-suite monorepo
    container_name: fartlek
    restart: unless-stopped
    volumes: ["./data:/data"]
    networks: [proxy]  # cloudflared reaches it at http://fartlek:3000, so no published port
    environment:
      AUTH_MODE: "oidc"
      SESSION_SECRET: "generate-with-openssl-rand-hex-32"
      # Encrypts users' Garmin API keys at rest. Keep it out of the repo; losing it means users re-paste their keys.
      RUNPLAN_MASTER_KEY: "generate-with-openssl-rand-hex-32"
      PUBLIC_URL: "https://fartlek.didrik.dev"
      OIDC_ISSUER: "https://sso.didrik.dev"  # Pocket ID
      OIDC_CLIENT_ID: "from-pocket-id"
      OIDC_CLIENT_SECRET: "from-pocket-id"
networks:
  proxy:
    external: true
# Pocket ID client: callback URL https://fartlek.didrik.dev/api/auth/callback
# (not group-restricted, or include your user's group).
# Cloudflare Tunnel: public hostname fartlek.didrik.dev -> http://fartlek:3000
