# One workflow for both CI (audit, docs, test, smoke) and CD (image, deploy), so the CD jobs can wait on
# the CI jobs with `needs:`. See docs/decisions/ci-cd-one-workflow.md.
name: ci-cd
on:
  push: { branches: [main], tags: ["*-v*"] }
  pull_request:
permissions:
  contents: read
  packages: write
  pull-requests: read # lets paths-filter list a PR's changed files
jobs:
  # Same gate as self-sufficiency-garden: fail on high or critical advisories in production dependencies.
  # npm audit reads package-lock.json, so no install is needed.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: npm audit --audit-level=high --omit=dev

  # The wiki in docs/: frontmatter, links, log format and that docs/index.md is up to date. No install needed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: npm run docs:check

  # test skips its steps when only docs/ changed. The job itself still succeeds, so it can stay
  # a required check; the audit above never skips.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - '!docs/**'
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run check
      - if: steps.changes.outputs.code == 'true'
        run: npm run build

  # Build every app's image on pull requests and start it the way production does. The tests run the
  # source; only this catches a bundle that builds but crashes at start (a dependency inlined into the
  # ESM server bundle, a missing file in the image). Skips an app whose files did not change, and still
  # succeeds then, so it can stay a required check.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [fartlek, kvitt, etapp, garden, portfolio, brygga]
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            app:
              - 'apps/${{ matrix.app }}/**'
              - 'packages/**'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'scripts/**'
      - if: steps.changes.outputs.app == 'true'
        run: docker build --build-arg APP=${{ matrix.app }} -t smoke .
      - if: steps.changes.outputs.app == 'true'
        run: |
          # Dummy values: just enough config for the server to start in production mode.
          docker run -d --name smoke -p 3000:3000 \
            -e AUTH_MODE=oidc -e OIDC_ISSUER=https://auth.example.com -e OIDC_CLIENT_ID=smoke -e OIDC_CLIENT_SECRET=smoke \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef -e PUBLIC_URL=http://localhost:3000 \
            -e RUNPLAN_MASTER_KEY=0123456789abcdef0123456789abcdef \
            smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

  image:
    needs: [audit, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [fartlek, kvitt, etapp, garden, portfolio, brygga]
    steps:
      - uses: actions/checkout@v7
      # Only rebuild an app's image when it, a shared package, or the build setup changed.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            app:
              - 'apps/${{ matrix.app }}/**'
              - 'packages/**'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'scripts/**'
      - id: go
        run: echo "build=${{ steps.changes.outputs.app == 'true' || startsWith(github.ref, format('refs/tags/{0}-v', matrix.app)) }}" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.go.outputs.build == 'true'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: steps.go.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          # One image per app: ghcr.io/<owner>/fartlek, ghcr.io/<owner>/kvitt, ghcr.io/<owner>/etapp
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=${{ matrix.app }}-v(.*),group=1
            type=sha
      - if: steps.go.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Tell Komodo to redeploy the stack (pull + up) once the images are pushed. The request is
  # signed like a GitHub webhook (X-Hub-Signature-256), which Komodo's listener verifies.
  # Skipped until the KOMODO_DEPLOY_URL secret is set; Komodo's daily auto update is the fallback.
  deploy:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.KOMODO_DEPLOY_URL }}
      SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
    steps:
      - if: env.URL != ''
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.*= //')
          curl --fail-with-body -sS -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body"
